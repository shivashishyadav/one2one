<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Rooms</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f0f0f; color: #e5e5e5;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .card {
            background: #1a1a1a; border: 1px solid #2a2a2a;
            border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 400px;
            text-align: center;
        }
        .icon { font-size: 40px; margin-bottom: 16px; }
        h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        p  { font-size: 14px; color: #666; margin-bottom: 28px; line-height: 1.6; }

        .input-row {
            display: flex; gap: 8px; margin-bottom: 12px;
        }
        input {
            flex: 1; background: #222; border: 1px solid #333;
            border-radius: 10px; color: #e5e5e5; font-size: 15px;
            padding: 11px 14px; outline: none; transition: border-color 0.2s;
        }
        input:focus { border-color: #2563eb; }
        input::placeholder { color: #444; }

        button {
            background: #2563eb; border: none; border-radius: 10px;
            color: white; font-size: 15px; font-weight: 600;
            padding: 11px 20px; cursor: pointer; transition: background 0.2s;
            white-space: nowrap;
        }
        button:hover { background: #1d4ed8; }

        .hint { font-size: 12px; color: #444; margin-top: 8px; }
        .examples { margin-top: 24px; }
        .examples p { font-size: 12px; color: #555; margin-bottom: 10px; }
        .chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .chip {
            background: #222; border: 1px solid #2a2a2a; border-radius: 20px;
            padding: 5px 14px; font-size: 13px; color: #888;
            cursor: pointer; transition: all 0.2s;
        }
        .chip:hover { background: #2a2a2a; color: #e5e5e5; border-color: #333; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">🔒</div>
    <h1>Private Rooms</h1>
    <p>Each room is private, holds 2 people,<br>and messages expire after 2 hours.</p>

    <div class="input-row">
        <input type="text" id="room-input"
               placeholder="room name e.g. 212#31"
               maxlength="40" autocomplete="off" />
        <button onclick="goToRoom()">Enter</button>
    </div>
    <div class="hint">Share the link once — it never changes.</div>
</div>

<script>
    function clean(name) {
        return name.toLowerCase().replace(/[^a-z0-9-]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
    }
    function goToRoom() {
        const val = document.getElementById('room-input').value.trim();
        const name = clean(val);
        if (!name) { document.getElementById('room-input').focus(); return; }
        window.location.href = '/room/' + name;
    }
    function setRoom(name) {
        document.getElementById('room-input').value = name;
        goToRoom();
    }
    document.getElementById('room-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') goToRoom();
    });
</script>
</body>
</html>
